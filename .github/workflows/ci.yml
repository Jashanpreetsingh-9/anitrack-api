name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: anitrack
          POSTGRES_PASSWORD: anitrack
          POSTGRES_DB: anitrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://anitrack:anitrack@localhost:5432/anitrack
      SECRET_KEY: ci-only-not-a-real-secret
      INTERNAL_AUTH_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Create test database
        env:
          PGPASSWORD: anitrack
        run: createdb -h localhost -U anitrack anitrack_test || true

      - name: Apply migrations
        run: uv run python -m alembic upgrade head

      - name: Check models match migrations
        run: uv run python -m alembic check

      - run: uv run python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [lint, test, docker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK }}"
